name: CI
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    services:
      mongo:
        image: mongo:7
        ports: ["27017:27017"]
        options: >-
          --health-cmd "mongosh --quiet --eval \"try{rs.status().ok}catch(e){rs.initiate({_id:'rs0',members:[{_id:0,host:'localhost:27017'}]}).ok}\""
          --health-interval 5s --health-retries 20
    env:
      TEST_MONGODB_URI: mongodb://localhost:27017/?replicaSet=rs0&directConnection=true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm test -w backend
      - run: npm run test:concurrency -w backend
      - run: npx tsc --noEmit -p frontend
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -r ai-service/requirements-dev.txt && cd ai-service && python -m pytest -q
